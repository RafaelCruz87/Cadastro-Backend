<div class="container">

        <h1>🎓 Cadastro Escolar</h1>

        <p class="subtitulo">
            Preencha seus dados para realizar o cadastro
        </p>


        <div class="campo">

            <label for="nome">
                👤 Nome
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
            >

        </div>


        <div class="campo">

            <label for="email">
                📧 E-mail
            </label>

            <input
                type="text"
                id="email"
                placeholder="Digite seu e-mail"
            >

        </div>


        <div class="campo">

            <label for="senha">
                🔐 Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
            >

        </div>


        <div class="regras">

            <h3>🔎 Regras da senha</h3>

         <p id="regraTamanho">⚪ Pelo menos 8 caracteres</p>

    <p id="regraMaiuscula">⚪ Pelo menos uma letra MAIÚSCULA</p>

    <p id="regraNumero">⚪ Pelo menos um número</p>

        </div>


        <button type="button" id="botao">

            🚀 Cadastrar

        </button>


        <div id="mensagem"></div>

    </div>
